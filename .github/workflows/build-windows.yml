name: Build Windows executable

# Builds a native Windows .exe on every push and lets it be downloaded from
# the run's "Artifacts" section (Actions tab), without requiring a GitHub
# Release. Trigger manually from the Actions tab with "Run workflow" too.
on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # SDL2_ttf pulls in freetype/harfbuzz/etc as separate DLLs, so rather
      # than hardcoding that list, resolve whatever the built exe actually
      # links against from MSYS2's /mingw64/bin (Windows system DLLs are
      # untouched since they don't live there).
      - name: Stage artifact (exe + required DLLs)
        run: |
          mkdir -p dist
          cp build/PixelSpriteEditor.exe dist/
          ldd build/PixelSpriteEditor.exe | grep -i '/mingw64/bin/' | awk '{print $3}' | sort -u | xargs -I{} cp {} dist/

      - uses: actions/upload-artifact@v4
        with:
          name: PixelSpriteEditor-windows-x64
          path: dist/
