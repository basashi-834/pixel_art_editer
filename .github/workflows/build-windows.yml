name: Build Windows package

# Publishes a framework-dependent win-x64 build (requires the .NET 8 Desktop
# Runtime on the user's machine, deliberately no self-contained native .exe
# -- see legacy-cpp-sdl2/NOTE.md for why) on every push, downloadable from
# the run's "Artifacts" section (Actions tab). Trigger manually too via
# "Run workflow".
on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Self-test (model/tools/PNG I/O logic)
        run: dotnet run --project src -- --selftest

      - name: Publish (framework-dependent, win-x64)
        run: >
          dotnet publish src/PixelSpriteEditor.csproj
          -c Release -r win-x64 --self-contained false
          -p:UseAppHost=false
          -o dist

      - name: Add run.bat + README
        run: |
          cp dist-template/run.bat dist/
          cp README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: PixelSpriteEditor-windows-x64
          path: dist/
